name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  lint:
    name: fmt + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - name: shellcheck
        run: shellcheck scripts/*.sh examples/*.sh examples/bench/*.sh examples/greet/*.sh

  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --all-targets
      - run: cargo test --all-targets

  # Imports the current Alpine minirootfs into a single .db and runs it.
  # Always resolved from latest-stable, so an upstream Alpine release breaking
  # the import path shows up here rather than in a user's first run.
  alpine-vm:
    name: alpine rootfs (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release

      # No arch argument: the script maps the runner's CPU to an Alpine arch,
      # so the guest binaries match the host and can actually be executed.
      - name: Fetch latest Alpine minirootfs
        run: scripts/fetch-alpine-rootfs.sh "$RUNNER_TEMP" | tee -a "$GITHUB_ENV"

      - name: Import and verify
        env:
          DBVM_DB: ${{ runner.temp }}/alpine.vm.db
        run: |
          dbvm=./target/release/dbvm
          $dbvm import-rootfs "$ALPINE_TARBALL"
          $dbvm verify
          $dbvm status

      - name: Guest filesystem matches the imported release
        env:
          DBVM_DB: ${{ runner.temp }}/alpine.vm.db
        run: |
          dbvm=./target/release/dbvm
          got=$($dbvm cat /etc/alpine-release | tr -d '[:space:]')
          echo "/etc/alpine-release = $got (expected $ALPINE_VERSION)"
          [ "$got" = "$ALPINE_VERSION" ]
          $dbvm ls /bin | head -20

      - name: Execute a guest binary without a namespace
        env:
          DBVM_DB: ${{ runner.temp }}/alpine.vm.db
        run: |
          got=$(./target/release/dbvm exec /bin/busybox -- echo ok)
          echo "dbvm exec busybox echo -> $got"
          [ "$got" = "ok" ]

      # `dbvm run` needs bwrap, unshare or root; the runner's AppArmor policy may
      # refuse unprivileged user namespaces. Reported but not gating -- `dbvm exec`
      # above already covers execution.
      - name: Enter the instance (best effort)
        continue-on-error: true
        env:
          DBVM_DB: ${{ runner.temp }}/alpine.vm.db
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq bubblewrap
          ./target/release/dbvm -v run sh -c 'cat /etc/alpine-release; uname -m'

      # First use with no instance must provision itself from latest-stable.
      - name: Provision from scratch
        env:
          DBVM_DB: ${{ runner.temp }}/fresh.vm.db
        run: |
          ./target/release/dbvm init
          ./target/release/dbvm status
          [ "$(./target/release/dbvm exec /bin/busybox -- echo ok)" = "ok" ]
