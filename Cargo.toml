[package]
name = "dbvm"
version = "0.1.0"
edition = "2024"
rust-version = "1.88" # edition 2024 + let-chains
description = "DBVM: a SQLite database is the whole system — filesystem, memory image and snapshots"
license = "MIT"

[[bin]]
name = "dbvm"
path = "src/bin/dbvm.rs"

[[bin]]
name = "elf2self"
path = "src/bin/elf2self.rs"

[[bin]]
name = "self-exec"
path = "src/bin/self-exec.rs"

[lib]
name = "dbvm"
path = "src/lib.rs"

[dependencies]
rusqlite = { version = "0.32", features = ["bundled"] }
clap = { version = "4.5", features = ["derive"] }
goblin = "0.9"
anyhow = "1.0"
libc = "0.2"
memmap2 = "0.9"
rustc-hash = "2.1"
walkdir = "2.5"
tar = "0.4"
flate2 = "1.0"
sha2 = "0.11.0"

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = 3
panic = "abort"
