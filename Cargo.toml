[package]
name = "selfdb"
version = "0.1.0"
edition = "2021"
description = "SELF: Your executable is a SQLite database — Rust port"
license = "MIT"

[[bin]]
name = "self"
path = "src/bin/self.rs"

[[bin]]
name = "elf2self"
path = "src/bin/elf2self.rs"

[[bin]]
name = "self-exec"
path = "src/bin/self-exec.rs"

[lib]
name = "selfdb"
path = "src/lib.rs"

[dependencies]
rusqlite = { version = "0.32", features = ["bundled"] }
clap = { version = "4.5", features = ["derive"] }
goblin = "0.9"
anyhow = "1.0"
libc = "0.2"
memmap2 = "0.9"
rustc-hash = "2.1"
walkdir = "2.5"
tar = "0.4"
zstd = "0.13"
rayon = "1.12"
lru = "0.12"
fuser = { version = "0.14", optional = true, default-features = false }
flate2 = "1.0"

[features]
default = []
fuse = ["fuser"]

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = 3
panic = "abort"
